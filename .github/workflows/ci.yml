name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Node runtime
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Export generated lockfile for pinning
        uses: actions/upload-artifact@v7
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error

  integration:
    name: VS Code integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run VS Code extension tests
        run: xvfb-run -a npm run test:integration

  package:
    name: Package VSIX (not publish)
    runs-on: ubuntu-24.04
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: gungnir-vsix
          path: vscode-gungnir.vsix
          if-no-files-found: error
