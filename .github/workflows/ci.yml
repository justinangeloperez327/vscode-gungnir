name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Node.js 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  integration:
    name: VS Code extension host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: VS Code integration tests (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: VS Code integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    name: Package VSIX (manual release only)
    runs-on: ubuntu-24.04
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: gungnir-vsix
          path: vscode-gungnir.vsix
          if-no-files-found: error
